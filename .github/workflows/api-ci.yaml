# Test, package, and deploy the Healthcare Data Quality API to AWS Lambda.
name: Healthcare API CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install -r api/requirements.txt
          python -m pip install pytest httpx

      - name: Run automated tests
        run: python -m pytest tests/ -v

      - name: Build Lambda deployment package
        run: |
          mkdir -p build
          python -m pip install -r api/requirements.txt -t build/
          cp -r api build/
          cd build
          zip -qr ../healthcare-api-lambda.zip .

      - name: Upload Lambda package
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-api-lambda
          path: healthcare-api-lambda.zip
          retention-days: 7

      - name: Authenticate to AWS using OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::406833060888:role/github-actions-healthcare-api-deploy
          aws-region: us-east-1

      - name: Deploy private AWS Lambda function
        shell: bash
        run: |
          set -euo pipefail
          FUNCTION="healthcare-data-quality-api"
          ROLE="arn:aws:iam::406833060888:role/healthcare-data-quality-api-lambda"

          if aws lambda get-function --function-name "$FUNCTION" >/dev/null 2>&1; then
            echo "Updating existing Lambda function"
            aws lambda update-function-code \
              --function-name "$FUNCTION" \
              --zip-file fileb://healthcare-api-lambda.zip \
              --no-cli-pager

            aws lambda wait function-updated \
              --function-name "$FUNCTION"

            aws lambda update-function-configuration \
              --function-name "$FUNCTION" \
              --runtime python3.13 \
              --handler api.lambda_handler.handler \
              --memory-size 256 \
              --timeout 15 \
              --environment "Variables={AUDIT_S3_BUCKET=healthcare-analytics-td-2026,CLOUDWATCH_METRICS_ENABLED=true}" \
              --no-cli-pager

            aws lambda wait function-updated \
              --function-name "$FUNCTION"
          else
            echo "Creating private Lambda function"
            aws lambda create-function \
              --function-name "$FUNCTION" \
              --runtime python3.13 \
              --role "$ROLE" \
              --handler api.lambda_handler.handler \
              --zip-file fileb://healthcare-api-lambda.zip \
              --memory-size 256 \
              --timeout 15 \
              --environment "Variables={AUDIT_S3_BUCKET=healthcare-analytics-td-2026,CLOUDWATCH_METRICS_ENABLED=true}" \
              --no-cli-pager

            aws lambda wait function-active \
              --function-name "$FUNCTION"
          fi


          echo "SUCCESS: Private healthcare API deployed to AWS Lambda."

